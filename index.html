<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面跳转中</title>
  <meta http-equiv="refresh" content="0;url=https://www.bilibili.com/video/BV1GJ411x7h7/">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #fallback {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: #333;
    }
    #fallback a {
      color: #00a1d6;
      text-decoration: none;
      font-size: 16px;
    }
    #fallback a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="fallback">
    <div>
      <p>页面未能自动跳转，请<a id="manualLink" href="https://www.bilibili.com/video/BV1GJ411x7h7/">点击这里手动跳转</a>。</p>
    </div>
  </div>

  <script>
    var target = 'https://www.bilibili.com/video/BV1GJ411x7h7/';
    // 静默跳转，不产生历史记录
    try { location.replace(target); } catch (e) {}
    // 等待 2 秒，若页面仍停留则显示手动跳转链接
    setTimeout(function () {
      var manual = document.getElementById('manualLink');
      manual.href = target;
      document.getElementById('fallback').style.display = 'flex';
    }, 2000);
  </script>
</body>
</html>
